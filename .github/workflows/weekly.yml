name: Weekly & Monthly Summary

on:
  schedule:
    - cron: '7 13 * * 0'  # 每周日 BJT 21:07（周报）
    - cron: '7 13 1 * *'  # 每月1日 BJT 21:07（月报）
  workflow_dispatch:
    inputs:
      type:
        description: '生成类型'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly
      force:
        description: '忽略存档数量限制（测试用）'
        required: false
        default: false
        type: boolean

jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，确保 archive/ 文件都在

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行周报 / 月报
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL_TYPE="${{ github.event.inputs.type }}"
          ARGS=""

          if [ -n "$MANUAL_TYPE" ]; then
            # 手动触发：按下拉选择
            [ "$MANUAL_TYPE" = "monthly" ] && ARGS="--monthly"
          elif [ "$SCHEDULE" = "7 13 1 * *" ]; then
            # 月报 cron
            ARGS="--monthly"
          elif [ "$SCHEDULE" = "7 13 * * 0" ]; then
            # 周报 cron：若今天恰逢1号，月报 cron 会处理，跳过避免重复发送
            if [ "$(date +%d)" = "01" ]; then
              echo "今天是每月1号，周报跳过（由月报 cron 处理）"
              exit 0
            fi
          fi

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "运行参数：$ARGS"
          python weekly.py $ARGS
